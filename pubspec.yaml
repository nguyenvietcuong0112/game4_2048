name: block_order_2048
description: "Block Order 2048 built with Flutter & Flame."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/configs/
    - assets/audio/
    - assets/images/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: PoetsenOne
      fonts:
        - asset: assets/fonts/PoetsenOne-Regular.ttf
          weight: 400
    - family: RobotoBold
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
