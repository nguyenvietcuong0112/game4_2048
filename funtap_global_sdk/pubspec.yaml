name: funtap_global_sdk
description: "Funtap Global SDK — ads (MAX + AdMob backfill), tracking, remote config, IAP, deeplink cho Flutter (Android/iOS). Dùng chung lõi native với 2 package Cocos."
version: 1.0.5
homepage: https://funtapglobal.com
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.funtap.global.sdk.flutter
        pluginClass: FGSDKFlutterPlugin
      ios:
        pluginClass: FGSDKFlutterPlugin
