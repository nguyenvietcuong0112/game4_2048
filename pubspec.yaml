name: block_order_2048
description: "Block Order 2048 built with Flutter & Flame."
publish_to: 'none'
version: 1.0.1+101

environment:
  sdk: ^3.13.0

dependencies:
  funtap_global_sdk:
    path: ./funtap_global_sdk
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    disable-swift-package-manager: true

  assets:
    - assets/levels/
    - assets/configs/
    - assets/audio/
    - assets/images/
    - assets/images/flowers/
    - assets/images/Level Complete/
    - assets/images/Shop/
    - assets/images/Journey/
    - assets/images/UI Home/
    - assets/images/UI Home/Home/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: PoetsenOne
      fonts:
        - asset: assets/fonts/PoetsenOne-Regular.ttf
          weight: 400
